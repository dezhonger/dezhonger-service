name: dezhonger-service

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: dezhonger
      POSTGRES_USER: dezhonger
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dezhonger -d dezhonger"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [backend]

  api:
    build:
      context: ./api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://dezhonger:${POSTGRES_PASSWORD}@db:5432/dezhonger?sslmode=disable
      LISTEN_ADDR: :8080
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?set PUBLIC_ORIGIN in .env}
      SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME:-dz_session}
      COOKIE_SECURE: "true"
      SESSION_TTL: 720h
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/api/healthz >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks: [backend]

  nginx:
    build:
      context: .
      dockerfile: deploy/nginx/Dockerfile
    restart: unless-stopped
    environment:
      PUBLIC_IP: ${PUBLIC_IP:?set PUBLIC_IP in .env}
    depends_on:
      api:
        condition: service_started
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - certbot-certs:/etc/letsencrypt:ro
      - certbot-webroot:/var/www/certbot:ro
    networks: [backend]

  certbot:
    image: certbot/certbot:v5.7.0
    restart: unless-stopped
    entrypoint: ["/opt/renew.sh"]
    volumes:
      - certbot-certs:/etc/letsencrypt
      - certbot-webroot:/var/www/certbot
      - ./deploy/certbot/renew.sh:/opt/renew.sh:ro
    networks: [backend]

volumes:
  postgres-data:
  certbot-certs:
  certbot-webroot:

networks:
  backend:
    driver: bridge
